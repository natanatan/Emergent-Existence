    text: 'On the quotient 𝓔/≈ , define a strict candidate temporal precedence relation ≺ₜ by: ▪ [eᵢ]
      ≺ₜ [eⱼ] iff eᵢ ≺⁺ eⱼ and not(eⱼ ≺⁺ eᵢ). This quotient construction does not assume that the original
      dependency graph is acyclic. [...] The transitive reachability relation then supplies strict partial-order
      structure on the quotient [...] A temporal interpretation is still not automatic. ≺ₜ is a structural
      order candidate.'
