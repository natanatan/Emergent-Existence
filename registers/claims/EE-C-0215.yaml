versions:
  v1:
    text: 'A narrower criterion is available: a geometric distinction becomes physically consequential
      when changing it changes the admissible relational organization of other instantiated structures
      rather than merely changing an investigator’s description. Let Adm(A,B | Geo) denote the set of
      couplings admissible between A and B under geometric organization Geo. If Geo ≠ Geo’ and this difference
      produces Adm(A,B | Geo) ≠ Adm(A,B | Geo’), then the geometric distinction has consequences for relational
      organization. ▪ physical spatiality = geometry with constitutive relational consequences ▪ physical
      ≠ material'
