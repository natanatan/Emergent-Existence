stage: Cl
title: Closure
current_chapter:
  book-1/beta: 6
claim: Closure occurs when the relations required to preserve a higher-order organization become internally
  sufficient as a domain, and that sufficiency remains available across the transformations by which the
  organization persists. A closed organization can then become a new relatum for higher-order relational
  construction.
