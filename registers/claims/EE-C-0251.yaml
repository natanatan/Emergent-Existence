  v1:
    text: 'Once localization classes that distinguish membership in a domain D are spatially coordinated,
      a relational membership boundary may be represented geometrically as ∂D: relational boundary ⇝ geometric
      boundary ⇝ spatial boundary. Only then do inside, outside, region, enclosure and surface acquire
      literal spatial interpretation.'
    introduced: '2026-09-29'
    edition: book-1/beta
    beta_heading: Boundary Can Now Become Spatial (13.19)
    note: Stays representational unless a constitutive criterion is added that licenses when a relational
      membership boundary counts as spatially realized.
