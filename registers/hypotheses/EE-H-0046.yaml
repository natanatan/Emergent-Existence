  reason: 'Derived in 5.12 within stated assumptions: a structural shared predicate, and quantification
    declared as a logical resource at 4.2. Order-independence of ∃ and ∀ keeps any computing enumeration
    from becoming an ordering of the relations'
status_text: Derived
resolve_by: A case in which ∃/∀ membership over a shared predicate still needed an operation beyond quantification
  would reopen it
