versions:
  v1:
    text: 'The organization of jointly resolvable loci becomes spatially coordinated when the localization
      of one cannot be varied freely without changing the relational localization structure around it:
      spatial localizations are not independently assignable. Schematically: ΔL(A) ↦ Δ{d(A,B), d(A,C),
      N(A), …}.'
