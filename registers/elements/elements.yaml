# Element table, generated from the Linking Lexicon (rev 4, synced with Book I Beta, 29 Sep 2026).
# Codes are permanent names for concepts. A claim's composition lists the codes it rests on constitutively.
elements:
- code: Om
  lexicon_id: origin
  label: Origin
  kind: foundation
  row: Om
  volume: 1
  book: 1
  chapter: 1
  section: '1.5'
  status: Defined term
  symbols:
  - Ω
  definition: 'The minimally resolved reference condition: a condition from which no operative distinction is available
    within the framework''s initial relational frame, Res_(W_0)(Ω) = ∅. Undifferentiated at that resolution, not
    the absolute absence of distinction. Not a place, moment, substance or cause, and not an anchor: a reference
    role is earned only later, in Closure.'
  reinstantiates:
  - Ho
  - Rg
  - An
  requires:
  - Ud
  refers_ahead_to:
  - Rd
- code: Df
  lexicon_id: difference
  label: Difference
  kind: foundation
  row: Df
  volume: 1
  book: 1
  chapter: 2
  section: '2.3'
  status: Working axiom (Prop. 2A)
  symbols:
  - 𝔇
  - ≬
  definition: 'Primitive Difference: the least constructive structure beyond Origin, a symmetric dyad whose two
    poles are related by symmetric, irreflexive non-equivalence ≬. Poles and difference are co-constitutive. Dyadicity
    is a stated primitive cost.'
  follows_in_reading:
  - Om
- code: Ds
  lexicon_id: distinction
  label: Distinction
  kind: stage
  row: Ds
  volume: 1
  book: 1
  chapter: 3
  section: '3.6'
  status: Working definition (Prop. 3A)
  symbols:
  - 𝒟
  definition: Difference becomes operative Distinction when the dyad's poles are promoted to a minimal configuration
    carrier and a nontrivial admissible transition relation 𝒰, invariant under Aut(𝔇), licenses succession between
    them.
  requires:
  - Df
  - Ut
- code: Bd
  lexicon_id: boundary
  label: Boundary
  kind: stage
  row: Bd
  volume: 1
  book: 1
  chapter: 4
  section: '4.12'
  status: Working definition
  symbols:
  - B_(ab)
  definition: 'A preserved criterion of non-collapse: two poles remain non-equivalent, as resolved by a frame W,
    across a declared family of diagnostic structural variations 𝔗_(test). That family belongs to the robustness
    test, not to the structure, and is a different type from admissible transformation 𝒰. A criterion of separability,
    not a spatial surface.'
  requires:
  - Ds
- code: Rl
  lexicon_id: relation
  label: Relation
  kind: stage
  row: Rl
  volume: 1
  book: 1
  chapter: 5
  section: '5.4'
  status: Working definition
  symbols:
  - r_(ij)
  - ℛ
  - R
  definition: 'Structure as mutual constraint among multiple retained distinctions: relations r_(ij) cease to vary
    independently and become parts of an organization ℛ whose pattern of mutual constraint persists. R = [r_(ij)]
    records the relations; a collection of relations becomes a structure only when they constrain one another.'
  requires:
  - Bd
  refers_ahead_to:
  - Ix
  - Dd
- code: Cl
  lexicon_id: closure
  label: Closure
  kind: stage
  row: Cl
  volume: 1
  book: 1
  chapter: 6
  section: '6.2'
  status: Working definition (Provisional)
  symbols:
  - Closed_(F)
  - Closed_F
  definition: 'A relational domain ℛ is structurally closed with respect to an invariant F when every dependency
    constitutively required to maintain F is supplied within ℛ, apart from inputs explicitly classed as non-constitutive
    conditions. The Minimal Closure Test (6.4) gives necessary conditions, deliberately one-way: internal sufficiency,
    constraint participation and consistent realizability. A snapshot predicate, not an operator, and not isolation
    from an environment. Simplicial completion (K4) is one possible later realization, not the meaning of closure.'
  requires:
  - Rl
  - Cn
  - Id
  - St
  refers_ahead_to:
  - Sm
  - Mm
- code: Or
  lexicon_id: orientation
  label: Orientation
  kind: stage
  row: Or
  volume: 1
  book: 1
  chapter: 7
  section: '7.2'
  status: Working definition (Provisional)
  symbols:
  - K_(ij)
  - ≺ₒ
  definition: 'Persistent, consequential non-equivalence between otherwise exchangeable relational dependency roles,
    bearing on whether a higher-order identity can re-enter the class referenced by its anchor A_(F). Derived, not
    primitive: an arrow is notation applied once the non-equivalence is established. Not partial order, causality,
    metric time or spatial direction.'
  requires:
  - Cl
  - An
  - Ea
  - Pr
  refers_ahead_to:
  - Cs
- code: Rt
  lexicon_id: return
  label: Return
  kind: stage
  row: Rt
  volume: 1
  book: 1
  chapter: 8
  section: '8.3'
  status: Working definition (Provisional)
  symbols:
  - Ret(A_(F); ·)
  - Ret
  definition: 'Departure from an independently specified identity class, oriented transformation, and re-entry into
    that class: Ret(A_(F); Σ_(k)) = 1 iff Σ_(k) ∈ O_(F) after genuine departure. A predicate over earned relations,
    not a new operation. Return of identity does not require exact repetition of state; persistence without departure
    is not return; and departure requires F to remain applicable, since a configuration to which F no longer applies
    has dissolved rather than departed, and its later re-satisfaction is re-instantiation, not return (8.4).'
  requires:
  - Or
  - An
  - Id
  - Su
  - Dr
  kept_distinct_from:
  - Fr
  - Pp
  refers_ahead_to:
  - Cs
- code: Fm
  lexicon_id: formalism
  label: Formalism
  kind: stage
  row: Fm
  volume: 1
  book: 1
  chapter: 9
  section: '9.26'
  status: Working definition (Provisional)
  symbols:
  - 𝔊
  definition: Mathematical structure introduced only after determining which operations the preceding ontology has
    earned. Formalism is not ontology.
  follows_in_reading:
  - Rt
- code: Sc
  lexicon_id: scale
  label: Scale
  kind: stage
  row: Sc
  volume: 1
  book: 1
  chapter: 10
  section: '10.2'
  status: Working definition
  symbols: []
  definition: 'Whether recursively related organizations can establish stable comparative relations without presupposing
    an external ruler: magnitude, then standard, then scale-relative equivalence.'
  follows_in_reading:
  - Fm
- code: Dt
  lexicon_id: distance
  label: Distance
  kind: stage
  row: Dt
  volume: 1
  book: 1
  chapter: 11
  section: '11.3'
  status: Working definition (Provisional)
  symbols:
  - d_(u)(A,B)
  definition: Relational separation becomes metrically expressible once magnitude applies to the mediation between
    relational positions. Difference is not separation; separation requires mediation.
  requires:
  - Sc
  - Cm
  - Po
  kept_distinct_from:
  - Ut
- code: Gm
  lexicon_id: geometry
  label: Geometry
  kind: stage
  row: Gm
  volume: 1
  book: 1
  chapter: 12
  section: '12.1'
  status: Working definition (Provisional)
  symbols: []
  definition: Metric relations stop being merely pairwise and constrain one another, so that neighborhoods persist
    and an effective dimension can be counted.
  requires:
  - Dt
- code: Sp
  lexicon_id: space
  label: Space
  kind: stage
  row: Sp
  volume: 1
  book: 1
  chapter: 13
  section: '13.23'
  status: Candidate derivation
  symbols:
  - Sp
  definition: 'Geometric organization becomes consequential: localizations constrain localizations, so that where
    something stands limits what else can be the case.'
  requires:
  - Gm
- code: Tm
  lexicon_id: time
  label: Time
  kind: stage
  row: Tm
  volume: 1
  book: 1
  chapter: 14
  section: '14.23'
  status: 'Candidate derivation: the strict quotient order ≺ₜ is the strongest result; metric duration remains conditional'
  symbols:
  - 𝒯
  definition: A temporal order is a stable, recursively recoverable strict ordering of relational transformations
    derived from retained dependency, constraining admissible histories without an external time parameter; under
    stated conditions it admits a measure without an external clock.
  follows_in_reading:
  - Sp
  requires:
  - Pr
