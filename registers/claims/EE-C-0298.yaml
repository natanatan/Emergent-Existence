    text: A field's alternatives coexist while the different conditionings they would produce can be carried
      together within one relational neighborhood; once they would shape the field into local geometries
      that no single neighborhood can hold together, feedback amplifies one and that one is retained.
      The geometry is the relational one of Chapters 11-13, and the threshold is a property of field and
      detector together.
