- item: matter
  deferred_to: Mt
  basis: 'Intro: Matter "persistent relational modes ... localized physical excitations"'
- item: quantum fields
  deferred_to: Mt
  basis: 'Intro: Matter as localized excitations; Qg possible'
- item: energy
  scope: book-2
