    text: Type preservation. The transformation maps admissible relational configurations to admissible
      relational configurations. It does not add coordinates, metric, physical time or other later structure.
      Nontriviality. 𝔗C contains at least one transformation other than identity or pure relabeling. Pre-specification.
      The class is stated before the closure result is inspected, preventing F and 𝔗C from being tuned
      after the fact to protect any desired grouping. Relevance. The transformations challenge relations
      that plausibly matter to the candidate organization rather than only changing inert labels.
