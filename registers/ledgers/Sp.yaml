- item: gravity
  deferred_to: Gv
  basis: 'Intro: Gravity "effective curvature dynamics"'
- item: gravitational field equations
  deferred_to: Gv
  basis: 'Intro: Gravity asks whether geometry "can acquire effective curvature dynamics"'
- item: matter
