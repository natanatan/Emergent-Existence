    text: 'If every member of A matches exactly one member of B and every member of B is matched, the
      pairing is a bijection. ▪ f : A ↔ B [...] ▪ A ~# B. Read plainly, A and B are the same size in the
      cardinal sense. [...] ▪ A ~# A; A ~# B ⇒ B ~# A; A ~# B ∧ B ~# C ⇒ A ~# C'
