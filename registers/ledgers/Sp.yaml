  deferred_to: Tm
- item: propagation interval
  deferred_to: Tm
- item: velocity
  deferred_to: Sx
  basis: 14.16 speed is not assignable until space and time "participate in one invariant physical structure";
    "central handoff at the end of Book I"
- item: causal speed
  deferred_to: Sx
  basis: 14.30 "Can a null boundary or invariant maximal rate emerge"; 14.31
- item: temporal simultaneity
  deferred_to: Sx
  basis: 14.10 "Refusal of Premature Simultaneity ... Dependency-incomparable events may later map to
    spacelike-separated events"; 14.26 Obj 6 "until additional physical structure justifies a stronger
    relation"
- item: proper time
  deferred_to: Sx
  basis: 14.14 cross-clock calibration "does not establish relativistic proper time"; 14.28
- item: Lorentzian signature
  deferred_to: Sx
  basis: 14.31 Book II must generate "causal geometry, Lorentzian signature"
- item: spacetime
  deferred_to: Sx
