versions:
  v1:
    text: 'A metric temporal quantity becomes defensible only if at least the following conditions can
      be satisfied: ordered comparability: the relevant states admit stable precedence relations; repeatable
      standard: a recurrent process provides distinguishable, countable cycles or phases; cross-standard
      calibration: independently realized recurrent processes exhibit stable comparative ratios over a
      regime; resolution robustness: the inferred temporal measure is not an artifact of one arbitrary
      decomposition into update steps; frame coherence: overlapping local frames agree on precedence where
      dependency is shared, even if their quantitative clock readings later differ; non-circularity: no
      external time variable or target relativistic behavior is built into the update rules that supposedly
      derive the measure. These conditions do not prove that metric time must emerge.'
    introduced: '2026-09-29'
