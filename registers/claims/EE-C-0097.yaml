versions:
  v1:
    text: 'Four diagnostics: Dependency leakage (number or fraction of F-maintaining dependencies that
      terminate outside the candidate domain; tests internal sufficiency); Constraint participation (ablation
      sensitivity of candidate constitutive relations compared with non-constitutive controls); Closure
      robustness (fraction of preregistered perturbations in 𝔗C after which ClosedF remains true); Higher-order
      addressability (agreement of macro-outcomes across distinct microstates in the same F-equivalence
      class under the same external coupling). A fifth diagnostic can compare candidate closures against
      matched random, merely connected, or equally dense control subgraphs.'
