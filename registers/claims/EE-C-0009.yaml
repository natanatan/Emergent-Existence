versions:
  v1:
    text: 'The least constructive structure beyond the unresolved Origin is a symmetric dyad whose two
      poles are numerically two as a primitive cost and are related by a symmetric, irreflexive relation
      of non-equivalence. Difference and its poles are co-constitutive: neither independently constituted
      relata nor a relation existing prior to all relata is asserted. ▪ 𝔇 = ⟨a, b ; ≬⟩ ▪ a ≬ b ⟺ b ≬ a
      ▪ ¬(a ≬ a) and ¬(b ≬ b)'
