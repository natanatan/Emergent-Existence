  deferred_to: Tm
- item: spatial location, metric, coordinate system, topology
  deferred_to: Sp
  basis: "Space requires geometrically coordinated localization; coordinates/topology come via Geometry (p.351); Space earns physical spatial position (p.268)"
  drafted: true
- item: geometry
  deferred_to: Gm
- item: matter, fields, energy, action, entropy, thermodynamic dynamics
  scope: beyond-book-1
  deferred_to: Mt
  basis: "Physical spacetime, dynamics, fields and matter remain beyond Book I (p.351); Matter asks whether persistent relational modes can appear as localized physical excitations with stable internal properties (p.12)"
  drafted: true
- item: objects, observers, agents, consciousness, meaning as primitives
  scope: not-earned-in-series
  basis: "Never admitted as primitives: observer-mediated measurement is a later implementation, not a primitive requirement (H-40, p.323); the series builds them late (p.11-13)"
  drafted: true
- item: causation or physical law of evolution
  scope: beyond-book-1
  deferred_to: Sx
  basis: "Causation adds constraints not yet present, incl. a causal geometry (p.284); Book II opens on whether Space and Time can be forced into a single causal geometry (p.11-12)"
