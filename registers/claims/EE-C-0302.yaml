    text: The stripes come from how the field's parts recombine; the dots come from the field's interaction
      with the screen's detection capacity. A complete interaction closes only where the parts reinforce
      strongly enough to support it. A detector at the slits puts the difference between them on record,
      the cross term disappears, and the stripes go while the dots remain.
