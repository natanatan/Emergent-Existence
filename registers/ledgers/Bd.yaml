claim: An operative Distinction becomes retained when its non-equivalence remains recoverable under declared
  structural variation and can constrain what remains admissible downstream. Boundary is the criterion
  under which that recoverability is preserved. The chapter earns frame-relative resolvability, admissible
  possibility, retained-dependency precedence, and criterion-based identity, all from retained distinction.
