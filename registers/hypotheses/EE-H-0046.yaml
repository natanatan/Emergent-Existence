hypothesis: 'Existential and universal boundary aggregation over a multi-relation domain need no new primitive:
  judged by one shared predicate P (the constraint test of 5.4), they are quantification over P, and 𝒜
  survives only as a notational convention. Distinct from frame reconciliation, which combines verdicts
  not judged by a shared predicate'
