stage: Tm
title: Time
current_chapter:
  book-1/beta: 14
claim: 'Time emerges where retained-dependency precedence, inherited from Boundary, supports an intrinsic
  order: where dependency cycles can be separated from ordered precedence, where that order is recoverable
  from retained structure itself, and where recurrent processes furnish endogenous standards of comparison.
  Time is thus earned from within; metric duration remains conditional.'
inherits:
- item: retained-dependency precedence ≺ (not assumed transitive, acyclic, total, asymmetric, causal or
    temporal; 4.11)
  from: Bd
- item: 'retained distinction: a distinction can remain available after transformation'
  from: Bd
- item: admissible possibility set 𝒫 (retaining or removing a distinction changes it)
  from: Bd
- item: admissible transition relation 𝒰
  from: Ds
- item: coordinated domain of localization, adjacency, extension, and neighboring local reference frames
  from: Sp
- item: relation set ℜ and configuration set 𝒞 of Formalism (referenced only to avoid notation clash)
  from: Fm
- item: scale-robustness tests used for Geometry and Space (14.22)
  from: Gm
earns:
- item: retained-dependency precedence ≺ as pre-temporal substrate
  detail: inherited retained-dependency precedence ≺ as the pre-temporal substrate for ordering
- item: strict partial-order candidate ≺ₜ
  detail: a derived strict partial-order candidate ≺ₜ on dependency-cycle equivalence classes, without
    a universal external clock
- item: chains, branches, merges, incomparable events
  detail: ordered chains, branches, merges, and dependency-incomparable events
- item: succession distinct from indexing
  detail: a distinction between succession and mere manuscript or algorithmic indexing
- item: structural record asymmetry
  detail: a structural record asymmetry by which some dependency orientations can be internally recovered
- item: endogenous temporal standards
  detail: a candidate route from recurrent relational processes to endogenous temporal standards
- item: metric temporal comparison
  detail: a candidate route from cross-clock calibration to metric temporal comparison
- item: local temporal organization
  detail: local temporal organization compatible with, but not yet equivalent to, later relativistic time
withholds:
- item: Lorentzian metric
  scope: book-2
- item: invariant light speed
  deferred_to: Sx
  basis: '14.31 not earned: "invariant c"; 14.30 "invariant maximal rate"'
- item: light cones and intervals
  deferred_to: Sx
  basis: 14.31 "Nothing in Book I licenses writing a Lorentzian interval by fiat ... causal cones"
- item: proper time
  deferred_to: Sx
  basis: 14.14 "Nor does it establish relativistic proper time"
- item: relative simultaneity
  deferred_to: Sx
  basis: 14.10 incomparable events "may later map to spacelike-separated events"; simultaneity "tied to
    the structure of spacetime"
- item: time dilation
  deferred_to: Sx
  basis: 14.15 "Book I does not derive the relativistic law governing such variation"; Lorentz transformations
    are Book II targets (14.31)
- item: gravitational redshift
  deferred_to: Gv
  basis: 14.15 "Curvature, acceleration ... could affect realized clock behavior"; Intro Gravity "effective
    curvature dynamics"
- item: cosmological time
  scope: book-2
  basis: 14.28 "any global time (cosmological time ...)" not earned; no single cosmology stage
- item: preferred foliation
  deferred_to: Sx
  basis: 14.28 global time not earned; 14.10 simultaneity is "tied to the structure of spacetime"
- item: universal present
  deferred_to: Sx
  basis: 14.26 Obj 6 "Objective temporal structure need not be a universal total order ... until additional
    physical structure justifies a stronger relation"; 14.15 "Local Rate Without a Universal Flow"
- item: 'thermodynamic arrow: entropy increase'
  scope: book-2
  basis: 14.17 the statistical arrow "invokes entropy, coarse-graining, boundary conditions, and statistical
    mechanics, none of which Book I has yet earned"
- item: microscopic irreversibility
  scope: book-2
  basis: 14.17 "The second belongs to the eventual physical dynamics"
- item: gravity
  deferred_to: Gv
  basis: 'Intro: Gravity "effective curvature dynamics"'
- item: field equations
  deferred_to: Gv
