    text: 'Anchor identity: an independently constrained identity class OF exists and functions in the
      Closure-earned reference role AF. Oriented transformation: admissible orientational dependencies
      generate a nontrivial sequence from a realization of OF. Departure: at least one intermediate configuration
      lies outside OF while F remains applicable to it (8.4). Re-entry: a resultant configuration ΣR again
      lies inside OF. ▪ Ret(AF; ·) = departure from OF ∧ oriented transformation ∧ re-entry into OF'
