stage: Dt
title: Distance
current_chapter:
  book-1/beta: 11
claim: Distance becomes available when distinct relational loci can be connected through admissible chains
  of mediation whose comparative burden is recoverable from the organization itself, allowing separation
  between loci to acquire magnitude.
