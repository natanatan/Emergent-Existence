  scope: open
  basis: "Origin does not derive Difference from Ω; a future reduction would have to show it (p.39); H-26 speculative (p.320)"
  drafted: true
- item: proof that Ω is an entity
  scope: open
  basis: "Ω is a working term whose entity-like reading remains provisional (p.38)"
  drafted: true
- item: hidden structure in Ω
  scope: open
  basis: "H-70: whether any difference exists in Ω below the initial resolution is Open (p.330); framework posits none (p.39)"
  drafted: true
- item: absolute featurelessness of Ω
  scope: not-earned-in-series
  basis: "Ω commits to neither absolute nothing nor perfect uniformity; refuses the inference from non-resolution to absence (p.38-39)"
  drafted: true
- item: physical instantiation of relational ontology
  scope: beyond-book-1
  deferred_to: Sx
