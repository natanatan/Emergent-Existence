  v1:
    text: A symbol, operator, relation or construction may perform ontological work only when its content
      is inherited from earlier chapters or definable from inherited structure. Richer mathematics may
      be used externally for proof, simulation or bookkeeping, but its additional structure must not be
      silently read back into the modeled world.
