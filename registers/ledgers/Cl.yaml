  from: Ds
- item: diagnostic transformation family (specialized here as 𝔗C)
  from: Bd
earns:
- item: structural closure (internal dependency sufficiency)
  detail: ClosedF(ℛ) as a predicate, tested by internal sufficiency, constraint participation and consistent
    realizability; closure with respect to F ≠ isolation.
- item: dynamic closure
  detail: Preservation or recurrent recovery of internal sufficiency under endogenous state-to-state updates
    𝒰, tested without making closure an operation of 𝒰.
- item: relational inside/outside (closure-based membership)
  detail: insideF = participation in the F-maintaining closure; outsideF = non-participation; closure
    and boundary become reciprocal. No aggregation primitive.
- item: non-exclusive (overlapping) membership
  detail: Closure need not imply exclusive membership; a relation can participate in more than one compatible
    closure.
- item: representative-independent higher-order addressability
  detail: E(Σa) ~F′ E(Σb) whenever Σa ~F Σb; a closed organization can enter further relations as one
    relatum.
- item: endogenous organizational reference / anchor AF (higher-order originhood)
  detail: A closed identity functioning in the earned reference role; a re-instantiated reference role,
    not a transmitted primitive center.
